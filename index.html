
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2457a7">
<title>오늘의 전시대 순환봉사 배정표</title>
<style>
:root{--blue:#2457a7;--bg:#f3f6fb;--ink:#172033;--muted:#667085;--line:#dce3ed}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,"Noto Sans KR",sans-serif;font-size:16px;line-height:1.45}
main{max-width:900px;margin:auto;padding:14px}
header{background:var(--blue);color:white;border-radius:16px;padding:20px 14px;text-align:center}
header h1{font-size:clamp(21px,5vw,29px);margin:0 0 5px}
header p{margin:0;font-size:14px;opacity:.95}
section{background:white;border:1px solid var(--line);border-radius:14px;padding:15px;margin-top:13px}
h2{font-size:19px;margin:0 0 12px}
h3{font-size:16px;margin:0 0 8px}
.small{font-size:13px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
input,select,textarea,button{font:inherit}
input,select,textarea{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:9px;background:white;color:var(--ink)}
textarea{resize:vertical;min-height:85px}
button{border:0;border-radius:9px;padding:11px 13px;background:var(--blue);color:white;font-weight:700;cursor:pointer}
button.secondary{background:#e8eef8;color:#193d77}
button.light{background:#f0f2f5;color:#293548}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}
.actions button{flex:1 1 150px}
.people{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.person{border:1px solid var(--line);border-radius:10px;padding:10px}
.group-tag{display:inline-block;padding:3px 8px;border-radius:20px;font-size:12px;font-weight:bold;margin-bottom:7px}
.g1{background:#dceafe;color:#174ea6}
.g2{background:#ddf5e5;color:#176b3a}
.g3{background:#fce8d5;color:#934500}
.g4{background:#f1e2fa;color:#6d2994}
.notice{background:#fff9e9;border:1px solid #f1dfa5;border-radius:10px;padding:10px}
.table-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:620px;font-size:14px}
th,td{border:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}
th{background:#edf2f9}
.slot{border:1px solid var(--line);border-radius:11px;padding:11px;margin-top:10px}
.slot h3{margin-bottom:9px}
.slot .table-wrap{margin-top:8px}
.personal-row{padding:10px;border-bottom:1px solid var(--line)}
.personal-row:last-child{border-bottom:0}
footer{text-align:center;color:var(--muted);font-size:12px;padding:18px 0}
[hidden]{display:none!important}
@media(max-width:520px){
 main{padding:9px}
 .grid,.people{grid-template-columns:1fr}
 section{padding:12px}
 header{padding:17px 10px}
}
@media print{
 body{background:white}
 main{max-width:none}
 button,.actions,#registerSection{display:none!important}
 section{break-inside:avoid}
}
</style>
</head>
<body>
<main>
<header>
<h1>오늘의 전시대 순환봉사 배정표</h1>
<p>4개 조 · 15분 교대 · 전체 명단 및 일정 공유</p>
</header>

<section id="registerSection">
<h2>① 참여자 이름과 조 등록</h2>
<p class="small">이름을 입력하고 조를 선택하세요. 이름을 입력하면 참여자 번호 표시는 사라집니다.</p>
<div id="peopleInputs" class="people"></div>
<div class="actions">
<button id="saveBtn">명단 저장</button>
<button class="secondary" id="clearBtn">명단 비우기</button>
</div>
</section>

<section>
<h2>② 공지사항</h2>
<textarea id="notice" maxlength="500" placeholder="공지사항을 입력하세요.
예: 봉사 시작 5분 전까지 모여 주세요.
변경 사항은 이곳에 적어 주세요."></textarea>
<div class="actions">
<button id="saveNoticeBtn">공지사항 저장</button>
</div>
</section>

<section>
<h2>③ 봉사 일정 선택</h2>
<div class="grid">
<div class="field">
<label for="slotSelect">일정</label>
<select id="slotSelect">
<option value="wed">수요일 저녁 18:00~20:00</option>
<option value="satAM">토요일 오전 10:00~12:00</option>
<option value="satPM">토요일 저녁 18:00~20:00</option>
</select>
</div>
<div class="field">
<label for="personSelect">개인 일정 보기</label>
<select id="personSelect">
<option value="">참여자 선택</option>
</select>
</div>
</div>
<div class="actions">
<button id="showPlanBtn">전체 순환 계획표 보기</button>
<button class="secondary" id="showPersonBtn">개인별 일정 보기</button>
</div>
<p class="small">A 전시대: 영인면사무소 앞 · B 전시대: 농협 하나로마트 앞</p>
</section>

<section id="planSection">
<h2>④ 전체 순환 계획표</h2>
<div id="planOutput"></div>
</section>

<section id="personalSection" hidden>
<h2>⑤ 개인별 일정</h2>
<div id="personalOutput"></div>
</section>

<section>
<h2>⑥ 공유 및 인쇄</h2>
<p class="small">공유 링크에는 현재 이름, 조, 공지사항이 들어갑니다. 명단을 수정하면 새 링크를 만들어 다시 공유하세요.</p>
<div class="actions">
<button id="shareBtn">공유 링크 만들기</button>
<button class="secondary" id="copyBtn">현재 링크 복사</button>
<button class="light" id="printBtn">계획표 인쇄</button>
</div>
<input id="shareUrl" aria-label="공유 링크" readonly placeholder="링크 만들기 버튼을 누르세요" style="margin-top:10px">
<p id="shareStatus" class="small" aria-live="polite"></p>
</section>

<footer>전시대 순환봉사 배정표 · 휴대폰용</footer>
</main>

<script>
(function(){
'use strict';

const STORE='displayStandRotationApp_v2';
const groupNames=['1조','2조','3조','4조'];
const groupClasses=['g1','g2','g3','g4'];

const slotNames={
 wed:'수요일 저녁 18:00~20:00',
 satAM:'토요일 오전 10:00~12:00',
 satPM:'토요일 저녁 18:00~20:00'
};

const roles={
 A:'A 전시대<br><span class="small">영인면사무소 앞</span>',
 B:'B 전시대<br><span class="small">농협 하나로마트 앞</span>',
 street:'가두봉사',
 rest:'휴식'
};

let state={
 people:Array.from({length:12},()=>({name:'',group:1})),
 notice:'',
 slot:'wed'
};

const $=id=>document.getElementById(id);

function safeLoad(){
 try{
  const params=new URLSearchParams(location.search);
  const packed=params.get('data');

  if(packed){
   const incoming=JSON.parse(
    decodeURIComponent(escape(atob(packed)))
   );

   if(incoming && Array.isArray(incoming.people)){
    state.people=Array.from({length:12},(_,i)=>({
     name:String(incoming.people[i]?.name||''),
     group:Math.min(4,Math.max(1,Number(incoming.people[i]?.group)||1))
    }));
    state.notice=String(incoming.notice||'');
    state.slot=slotNames[incoming.slot]?incoming.slot:'wed';
    return;
   }
  }
 }catch(e){}

 try{
  const saved=localStorage.getItem(STORE);
  if(saved){
   const s=JSON.parse(saved);
   if(Array.isArray(s.people)){
    state.people=Array.from({length:12},(_,i)=>({
     name:String(s.people[i]?.name||''),
     group:Math.min(4,Math.max(1,Number(s.people[i]?.group)||1))
    }));
   }
   state.notice=String(s.notice||'');
   state.slot=slotNames[s.slot]?s.slot:'wed';
  }
 }catch(e){}
}

function save(){
 try{
  localStorage.setItem(STORE,JSON.stringify(state));
 }catch(e){}
}

function escapeHtml(s){
 return String(s).replace(/[&<>"']/g,c=>({
  '&':'&amp;',
  '<':'&lt;',
  '>':'&gt;',
  '"':'&quot;',
  "'":'&#39;'
 }[c]));
}

function renderPeople(){
 $('peopleInputs').innerHTML=state.people.map((p,i)=>`
  <div class="person">
   ${p.name.trim()?'':`<span class="group-tag ${groupClasses[p.group-1]}">참여자 ${i+1}</span>`}
   <div class="field">
    <label for="name${i}">이름 ${i+1}</label>
    <input id="name${i}" maxlength="30" placeholder="이름 입력"
     value="${escapeHtml(p.name)}">
   </div>
   <div class="field" style="margin-top:7px">
    <label for="group${i}">소속 조</label>
    <select id="group${i}">
     ${groupNames.map((g,j)=>`
      <option value="${j+1}" ${p.group===j+1?'selected':''}>${g}</option>
     `).join('')}
    </select>
   </div>
  </div>
 `).join('');

 state.people.forEach((p,i)=>{
  $('name'+i).addEventListener('input',e=>{
   state.people[i].name=e.target.value;
   save();
   renderPeoplePreservingFocus(i);
   renderPersonOptions();
   renderPlan();
  });

  $('group'+i).addEventListener('change',e=>{
   state.people[i].group=Number(e.target.value);
   save();
   renderPeople();
   renderPersonOptions();
   renderPlan();
  });
 });
}

function renderPeoplePreservingFocus(index){
 const input=$('name'+index);
 const pos=input ? input.selectionStart : null;
 renderPeople();
 const replacement=$('name'+index);
 if(replacement){
  replacement.focus();
  if(pos!==null) replacement.setSelectionRange(pos,pos);
 }
}

function renderPersonOptions(){
 const old=$('personSelect').value;

 $('personSelect').innerHTML=
  '<option value="">참여자 선택</option>'+
  state.people.map((p,i)=>p.name.trim()
   ?`<option value="${i}">${escapeHtml(p.name.trim())} (${p.group}조)</option>`
   :''
  ).join('');

 if(old && $('personSelect').querySelector(`option[value="${old}"]`)){
  $('personSelect').value=old;
 }
}

function assignments(step){
 const rolesByStep=[
  ['A','street','B','B'],
  ['street','B','rest','A'],
  ['B','rest','A','street'],
  ['rest','A','street','B']
 ];
 return rolesByStep[step%4].map((role,i)=>({
  group:i+1,
  role
 }));
}

function timeFor(step,startHour){
 const mins=startHour*60+step*15;
 const h=Math.floor(mins/60);
 const m=mins%60;
 const end=mins+15;

 return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}–${String(Math.floor(end/60)).padStart(2,'0')}:${String(end%60).padStart(2,'0')}`;
}

function makeSlot(slot){
 const start=slot==='satAM'?10:18;
 let rows='';

 for(let step=0;step<8;step++){
  const a=assignments(step);

  rows+=`<tr>
   <td>${timeFor(step,start)}</td>
   ${a.map(x=>`
    <td>
     <b class="${groupClasses[x.group-1]}">${x.group}조</b><br>
     ${roles[x.role]}
    </td>
   `).join('')}
  </tr>`;
 }

 return `
  <div class="slot">
   <h3>${slotNames[slot]}</h3>
   <div class="table-wrap">
    <table>
     <thead>
      <tr><th>시간</th><th>1조</th><th>2조</th><th>3조</th><th>4조</th></tr>
     </thead>
     <tbody>${rows}</tbody>
    </table>
   </div>
  </div>`;
}

function renderPlan(){
 const names=state.people.filter(p=>p.name.trim()).map(p=>`
  <span class="group-tag ${groupClasses[p.group-1]}">${p.group}조</span>
  ${escapeHtml(p.name.trim())}
 `).join('　') ||
 '<span class="small">아직 등록된 참여자가 없습니다.</span>';

 const notice=state.notice.trim()
  ?`<div class="notice"><b>공지사항</b><br>${escapeHtml(state.notice).replace(/\n/g,'<br>')}</div>`
  :'';

 $('planOutput').innerHTML=`
  ${notice}
  <div style="margin:10px 0"><b>참여자 명단</b><br>${names}</div>
  ${makeSlot('wed')}
  ${makeSlot('satAM')}
  ${makeSlot('satPM')}
  <p class="small">※ 실제 현장 인원에 따라 조별 배정과 휴식은 담당자가 조정할 수 있습니다.</p>
 `;
}

function renderPersonal(){
 const idx=$('personSelect').value;

 if(idx===''){
  $('personalOutput').innerHTML='<p>먼저 참여자를 선택해 주세요.</p>';
  return;
 }

 const p=state.people[Number(idx)];

 if(!p || !p.name.trim()){
  $('personalOutput').innerHTML='<p>이름이 등록되지 않았습니다.</p>';
  return;
 }

 let out=`<p><b>${escapeHtml(p.name)}</b> · ${p.group}조</p>`;

 for(const slot of ['wed','satAM','satPM']){
  const start=slot==='satAM'?10:18;

  out+=`<div class="slot"><h3>${slotNames[slot]}</h3>`;

  for(let step=0;step<8;step++){
   const a=assignments(step).find(x=>x.group===p.group);
   const roleText=roles[a.role]
    .replace(/<br><span class="small">.*?<\/span>/,'')
    .replace(/<[^>]+>/g,'');

   out+=`
    <div class="personal-row">
     <b>${timeFor(step,start)}</b> — ${roleText}
    </div>
   `;
  }

  out+='</div>';
 }

 $('personalOutput').innerHTML=out;
}

function renderAll(){
 renderPeople();
 renderPersonOptions();
 $('notice').value=state.notice;
 $('slotSelect').value=state.slot;
 renderPlan();
}

function packData(){
 const data={
  people:state.people.map(p=>({
   name:p.name.trim(),
   group:p.group
  })),
  notice:state.notice,
  slot:state.slot
 };

 return btoa(unescape(encodeURIComponent(JSON.stringify(data))));
}

$('saveBtn').addEventListener('click',()=>{
 state.people.forEach((p,i)=>{
  p.name=$('name'+i).value.trim();
  p.group=Number($('group'+i).value)||1;
 });

 save();
 renderAll();
 $('shareStatus').textContent='명단을 저장했습니다.';
});

$('clearBtn').addEventListener('click',()=>{
 if(!confirm('이 기기의 참여자 이름을 모두 비울까요?'))return;

 state.people=state.people.map(p=>({
  name:'',
  group:p.group
 }));

 save();
 renderAll();
 $('shareStatus').textContent='이름을 비웠습니다.';
});

$('saveNoticeBtn').addEventListener('click',()=>{
 state.notice=$('notice').value;
 save();
 renderPlan();
 $('shareStatus').textContent='공지사항을 저장했습니다.';
});

$('slotSelect').addEventListener('change',e=>{
 state.slot=e.target.value;
 save();
});

$('showPlanBtn').addEventListener('click',()=>{
 $('planSection').scrollIntoView({behavior:'smooth'});
});

$('showPersonBtn').addEventListener('click',()=>{
 renderPersonal();
 $('personalSection').hidden=false;
 $('personalSection').scrollIntoView({behavior:'smooth'});
});

$('personSelect').addEventListener('change',()=>{
 if($('personSelect').value!==''){
  renderPersonal();
  $('personalSection').hidden=false;
 }
});

$('shareBtn').addEventListener('click',()=>{
 state.people.forEach((p,i)=>{
  const n=$('name'+i);
  const g=$('group'+i);
  if(n)p.name=n.value.trim();
  if(g)p.group=Number(g.value)||1;
 });

 state.notice=$('notice').value;
 state.slot=$('slotSelect').value;

 save();
 renderAll();

 const url=new URL(location.href);
 url.search='';
 url.hash='';
 url.searchParams.set('data',packData());

 $('shareUrl').value=url.toString();
 $('shareStatus').textContent='공유 링크를 만들었습니다. 링크를 복사해 카카오톡에 보내세요.';
});

$('copyBtn').addEventListener('click',async()=>{
 const val=$('shareUrl').value;

 if(!val){
  $('shareStatus').textContent='먼저 공유 링크를 만들어 주세요.';
  return;
 }

 try{
  await navigator.clipboard.writeText(val);
  $('shareStatus').textContent='링크를 복사했습니다. 카카오톡에 붙여넣으세요.';
 }catch(e){
  $('shareUrl').focus();
  $('shareUrl').select();

  try{
   document.execCommand('copy');
   $('shareStatus').textContent='링크를 복사했습니다. 카카오톡에 붙여넣으세요.';
  }catch(err){
   $('shareStatus').textContent='링크를 길게 눌러 복사해 주세요.';
  }
 }
});

$('printBtn').addEventListener('click',()=>window.print());

safeLoad();
renderAll();

})();
</script>
</body>
</html>
