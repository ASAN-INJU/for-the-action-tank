
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#246BFD">
<title>전시대봉사계획표</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#f4f7fb;
  font-family:Arial,"Noto Sans KR",sans-serif;
  color:#172033
}
.wrap{max-width:820px;margin:auto;padding:12px}

/* 제목: 2포인트 축소, 한 줄 */
h1{
  text-align:center;
  font-size:24px;
  white-space:nowrap;
  margin:8px 0 10px;
  letter-spacing:-1px
}

.notice-box{
  border:2px solid #222;
  border-radius:10px;
  background:#fff;
  padding:8px;
  margin:0 0 10px
}
.notice-title{
  text-align:center;
  font-size:17px;
  font-weight:bold;
  margin-bottom:6px
}
.notice-input{
  width:100%;
  height:78px;
  resize:none;
  border:1.5px solid #aaa;
  border-radius:7px;
  padding:7px 8px;
  font-size:15px;
  line-height:1.5;
  font-family:inherit
}

.days{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-bottom:14px
}
.day{
  border:0;
  border-radius:14px;
  padding:15px 5px;
  font-size:21px;
  font-weight:bold;
  color:#fff;
  white-space:nowrap
}
.wed{background:#246BFD}
.sat{background:#18A566}
.day.active{outline:4px solid #ffd400}

.card{
  background:#fff;
  border:2px solid #222;
  border-radius:16px;
  padding:12px;
  margin-bottom:14px;
  box-shadow:0 2px 8px #0001
}
.title{
  text-align:center;
  font-size:21px;
  font-weight:bold;
  margin:2px 0 12px
}
.team{
  display:grid;
  grid-template-columns:62px 1fr 1fr 1fr;
  gap:6px;
  margin-bottom:8px
}
.team b{
  display:flex;
  align-items:center;
  justify-content:center;
  border:2px solid #222;
  border-radius:9px;
  background:#eef2f7;
  font-size:17px
}
input{
  width:100%;
  min-width:0;
  padding:12px 7px;
  font-size:17px;
  border:2px solid #aaa;
  border-radius:9px;
  text-align:center
}
.buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:10px
}
button{
  border:0;
  border-radius:11px;
  padding:13px;
  font-size:18px;
  font-weight:bold;
  color:white
}
.save{background:#246BFD}
.reset{
  background:#555;
  font-size:17px;
  white-space:nowrap
}
.note{
  text-align:center;
  font-size:14px;
  color:#666;
  margin:8px 0 0
}

/* 요일 제목: 2포인트 축소, 한 줄 */
.current{
  text-align:center;
  font-size:18px;
  font-weight:bold;
  padding:10px 4px;
  border-radius:10px;
  background:#eef3ff;
  margin-bottom:12px;
  white-space:nowrap;
  letter-spacing:-.5px
}

/* 시간 칸 너비 확대 */
table{
  width:100%;
  border-collapse:separate;
  border-spacing:0;
  overflow:hidden;
  border:2px solid #222;
  border-radius:10px;
  table-layout:fixed
}
th,td{
  border-right:1.5px solid #222;
  border-bottom:1.5px solid #222;
  text-align:center;
  padding:9px 3px;
  overflow-wrap:normal;
  word-break:keep-all
}
th:last-child,td:last-child{border-right:0}
tr:last-child td{border-bottom:0}
th{
  background:#e8edf7;
  font-size:14px
}
td{
  font-size:14px;
  font-weight:bold;
  vertical-align:middle
}
.time{
  background:#fafafa;
  font-size:10px;
  white-space:nowrap;
  letter-spacing:-.5px;
  padding-left:1px;
  padding-right:1px
}
.g1{background:#fff3a6}
.g2{background:#cfe8ff}
.g3{background:#d9f5d2}
.g4{background:#ffd8e8}
small{font-size:11px;line-height:1.25}

/* 개인별 카톡 공유 */
.share-card{
  background:#fff;
  border:2px solid #246BFD;
  border-radius:16px;
  padding:12px;
  margin-bottom:14px;
  box-shadow:0 2px 8px #0001
}
.share-title{
  text-align:center;
  font-size:21px;
  font-weight:bold;
  margin:2px 0 12px
}
.person-select{
  width:100%;
  padding:13px 10px;
  font-size:18px;
  border:2px solid #246BFD;
  border-radius:10px;
  background:#fff
}
.share-preview{
  margin-top:10px;
  background:#f4f7ff;
  border-radius:12px;
  padding:12px;
  font-size:16px;
  line-height:1.6;
  white-space:pre-line;
  min-height:70px
}
.share-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:10px
}
.share-buttons button{font-size:17px;padding:13px}
.kakao{background:#FEE500;color:#191919}
.copy{background:#246BFD}

/* 마무리 인사 */
.footer-message{
  text-align:center;
  background:#eaf7ee;
  border:2px solid #18A566;
  border-radius:12px;
  padding:15px 5px;
  margin:8px 0 18px;
  font-size:17px;
  font-weight:bold;
  line-height:1.5;
  color:#176b43;
  word-break:keep-all
}

@media(max-width:520px){
  .wrap{padding:7px}

  h1{
    font-size:20px;
    letter-spacing:-1px;
    margin:8px 0 10px
  }

  .notice-title{font-size:15px}
  .notice-input{height:72px;font-size:14px}

  .day{
    font-size:17px;
    padding:14px 3px
  }

  .card{padding:9px}
  .title{font-size:19px}

  .team{
    grid-template-columns:49px 1fr 1fr 1fr;
    gap:4px
  }
  .team b{font-size:14px}

  input{font-size:14px;padding:10px 3px}

  .buttons button{
    font-size:15px;
    padding:12px 3px;
    white-space:nowrap
  }

  .current{
    font-size:16px;
    padding:10px 2px;
    letter-spacing:-.7px
  }

  /* 시간 칸을 전체 너비의 25%로 확대 */
  table{table-layout:fixed}
  th,td{padding:8px 1px}
  th{font-size:10px}
  td{font-size:11px}
  .time{
    font-size:8px;
    letter-spacing:-.6px;
    padding-left:0;
    padding-right:0
  }
  small{font-size:9px}

  .share-title{font-size:19px}
  .person-select{font-size:17px;padding:12px 8px}
  .share-preview{font-size:15px}
  .share-buttons button{font-size:16px;padding:12px 4px}

  .footer-message{
    font-size:15px;
    padding:13px 4px
  }
}
</style>
</head>

<body>
<div class="wrap">

<h1>전시대봉사계획표</h1>

<div class="notice-box">
  <div class="notice-title">공지사항</div>
  <textarea id="noticeInput" class="notice-input" rows="3"
    placeholder="공지사항을 입력하세요.&#10;한 줄씩 최대 3줄 정도 기록할 수 있습니다."></textarea>
</div>

<div class="days">
  <button id="wedBtn" class="day wed active"
    onclick="changeDay('wed')">🟦 수요일</button>
  <button id="satBtn" class="day sat"
    onclick="changeDay('sat')">🟩 토요일</button>
</div>

<div class="current" id="currentDay">🟦 수요일 전시대 봉사표</div>

<div class="card">
  <div class="title">① 조 편성</div>

  <div class="team">
    <b>1조</b>
    <input id="g11" placeholder="이름">
    <input id="g12" placeholder="이름">
    <input id="g13" placeholder="이름">
  </div>

  <div class="team">
    <b>2조</b>
    <input id="g21" placeholder="이름">
    <input id="g22" placeholder="이름">
    <input id="g23" placeholder="이름">
  </div>

  <div class="team">
    <b>3조</b>
    <input id="g31" placeholder="이름">
    <input id="g32" placeholder="이름">
    <input id="g33" placeholder="이름">
  </div>

  <div class="team">
    <b>4조</b>
    <input id="g41" placeholder="이름">
    <input id="g42" placeholder="이름">
    <input id="g43" placeholder="이름">
  </div>

  <div class="buttons">
    <button class="save" onclick="save()">💾 이름 저장</button>
    <button class="reset" onclick="resetNames()">↺ 이름 지우기</button>
  </div>

  <p class="note">※ 2명만 근무하는 조는 세 번째 칸을 비워두세요.</p>
</div>

<div class="card">
  <div class="title">② 15분 순환 봉사</div>

  <table>
    <colgroup>
      <col style="width:25%">
      <col style="width:18.75%">
      <col style="width:18.75%">
      <col style="width:18.75%">
      <col style="width:18.75%">
    </colgroup>
    <thead>
      <tr>
        <th>시간</th>
        <th>전시대</th>
        <th>만득이</th>
        <th><b>[面]</b><br>건너<br>정류장</th>
        <th><b>[面]</b><br>앞<br>정류장</th>
      </tr>
    </thead>
    <tbody id="schedule"></tbody>
  </table>
</div>

<div class="share-card">
  <div class="share-title">③ 개인별 카톡 보내기</div>

  <select id="personSelect" class="person-select"
    onchange="updatePersonalShare()">
    <option value="">먼저 이름을 입력하세요</option>
  </select>

  <div id="sharePreview" class="share-preview">
    이름을 선택하면 해당 봉사자의 시간표가 여기에 표시됩니다.
  </div>

  <div class="share-buttons">
    <button class="kakao" onclick="shareKakao()">💬 카톡으로 보내기</button>
    <button class="copy" onclick="copyPersonal()">📋 내용 복사</button>
  </div>

  <p class="note">※ 휴대폰에서는 카톡으로 보내기를 누른 뒤 카카오톡을 선택하세요.</p>
</div>

<div class="footer-message">
  오늘도 격려적인 전시대봉사가 되시기를 바랍니다!
</div>

</div>

<script>
let currentDay="wed";

function saveNotice(){
  localStorage.setItem(
    currentDay+"_notice",
    document.getElementById("noticeInput").value
  );
}

function loadNotice(){
  document.getElementById("noticeInput").value =
    localStorage.getItem(currentDay+"_notice") || "";
}

const slots=[
  ["06:00~06:15",[1,2,3,4]],
  ["06:15~06:30",[4,1,2,3]],
  ["06:30~06:45",[3,4,1,2]],
  ["06:45~07:00",[2,3,4,1]],
  ["07:00~07:15",[1,2,3,4]],
  ["07:15~07:30",[4,1,2,3]],
  ["07:30~07:45",[3,4,1,2]],
  ["07:45~08:00",[2,3,4,1]]
];

function key(n,i){
  return currentDay+"_g"+n+i;
}

function saveCurrent(){
  for(let n=1;n<=4;n++){
    for(let i=1;i<=3;i++){
      localStorage.setItem(
        key(n,i),
        document.getElementById("g"+n+i).value
      );
    }
  }
}

function load(){
  for(let n=1;n<=4;n++){
    for(let i=1;i<=3;i++){
      document.getElementById("g"+n+i).value =
        localStorage.getItem(key(n,i)) || "";
    }
  }
  loadNotice();
  render();
}

function groupName(n){
  let a=[];
  for(let i=1;i<=3;i++){
    let v=document.getElementById("g"+n+i).value.trim();
    if(v) a.push(v);
  }
  return a.length
    ? n+"조<br><small>"+a.join(" · ")+"</small>"
    : n+"조";
}

function render(){
  const tb=document.getElementById("schedule");
  tb.innerHTML="";

  slots.forEach(s=>{
    const tr=document.createElement("tr");
    tr.innerHTML=
      "<td class='time'>"+s[0]+"</td>"+
      s[1].map(n=>
        "<td class='g"+n+"'>"+groupName(n)+"</td>"
      ).join("");
    tb.appendChild(tr);
  });

  updatePersonList();
}

function save(){
  saveCurrent();
  saveNotice();
  render();
  alert(
    currentDay==="wed"
      ? "수요일 이름이 저장되었습니다."
      : "토요일 이름이 저장되었습니다."
  );
}

function resetNames(){
  if(confirm(
    (currentDay==="wed"?"수요일":"토요일")+
    " 이름만 모두 지울까요?"
  )){
    for(let n=1;n<=4;n++){
      for(let i=1;i<=3;i++){
        document.getElementById("g"+n+i).value="";
        localStorage.removeItem(key(n,i));
      }
    }
    render();
  }
}

function changeDay(day){
  saveCurrent();
  saveNotice();

  currentDay=day;

  document.getElementById("wedBtn")
    .classList.toggle("active",day==="wed");
  document.getElementById("satBtn")
    .classList.toggle("active",day==="sat");

  document.getElementById("currentDay").textContent =
    day==="wed"
      ? "🟦 수요일 전시대 봉사표"
      : "🟩 토요일 전시대 봉사표";

  load();
}

function getPeople(){
  const people=[];
  for(let n=1;n<=4;n++){
    for(let i=1;i<=3;i++){
      const v=document.getElementById("g"+n+i).value.trim();
      if(v && !people.some(p=>p.name===v)){
        people.push({name:v,group:n});
      }
    }
  }
  return people;
}

function updatePersonList(){
  const sel=document.getElementById("personSelect");
  if(!sel) return;

  const old=sel.value;
  const people=getPeople();

  sel.innerHTML="";

  if(!people.length){
    sel.innerHTML='<option value="">먼저 이름을 입력하세요</option>';
    updatePersonalShare();
    return;
  }

  sel.innerHTML='<option value="">봉사자 선택</option>';

  people.forEach(p=>{
    let o=document.createElement("option");
    o.value=p.name;
    o.textContent=p.name+" ("+p.group+"조)";
    sel.appendChild(o);
  });

  if(people.some(p=>p.name===old)){
    sel.value=old;
  }

  updatePersonalShare();
}

function personalText(){
  const name=document.getElementById("personSelect").value;
  if(!name) return "";

  const p=getPeople().find(x=>x.name===name);
  if(!p) return "";

  const places=[
    "전시대",
    "만득이",
    "[面] 건너 정류장",
    "[面] 앞 정류장"
  ];

  let a=[
    "📋 "+(currentDay==="wed"?"수요일":"토요일")+" 전시대 봉사표",
    "👤 "+name+" · "+p.group+"조",
    ""
  ];

  slots.forEach(s=>{
    const pos=s[1].indexOf(p.group);
    if(pos>=0){
      a.push("⏰ "+s[0]+" → "+places[pos]);
    }
  });

  a.push("");
  a.push("※ 15분 단위로 이동합니다.");
  a.push("");
  a.push("오늘도 격려적인 전시대봉사가 되시기를 바랍니다!");

  return a.join("\n");
}

function updatePersonalShare(){
  const b=document.getElementById("sharePreview");
  if(b){
    b.textContent=personalText() ||
      "이름을 선택하면 해당 봉사자의 시간표가 여기에 표시됩니다.";
  }
}

async function copyPersonal(){
  const t=personalText();

  if(!t){
    alert("먼저 봉사자를 선택하세요.");
    return;
  }

  try{
    await navigator.clipboard.writeText(t);
  }catch(e){
    let x=document.createElement("textarea");
    x.value=t;
    document.body.appendChild(x);
    x.select();
    document.execCommand("copy");
    x.remove();
  }

  alert("개인 봉사표가 복사되었습니다.\n카카오톡에 붙여넣기 하세요.");
}

async function shareKakao(){
  const t=personalText();

  if(!t){
    alert("먼저 봉사자를 선택하세요.");
    return;
  }

  if(navigator.share){
    try{
      await navigator.share({
        title:"개인 전시대 봉사표",
        text:t
      });
    }catch(e){}
  }else{
    await copyPersonal();
  }
}

document.querySelectorAll("input").forEach(x=>{
  x.addEventListener("input",render);
});

document.getElementById("noticeInput")
  .addEventListener("input",saveNotice);

load();
</script>
</body>
</html>
