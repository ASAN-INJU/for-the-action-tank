
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#246BFD">
<title>전시대 순환봉사앱</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f2f5fa;color:#1c2738;font-family:Arial,"Malgun Gothic",sans-serif}
header{background:#246BFD;color:white;text-align:center;padding:20px 12px}
header h1{font-size:23px;margin:0 0 7px}
header p{font-size:13px;margin:0}
main{max-width:900px;margin:auto;padding:12px}
.card{background:white;border-radius:14px;padding:15px;margin-bottom:13px;box-shadow:0 2px 8px #1720330d}
h2{font-size:18px;margin:0 0 12px}
button,input,select,textarea{font:inherit}
button{border:0;border-radius:9px;background:#246BFD;color:white;padding:11px 12px;font-weight:bold;cursor:pointer}
.secondary{background:#e8eefb;color:#214a9b}
.green{background:#16804a}
.orange{background:#e87516}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tabs button{font-size:13px;padding:12px 3px}
.tabs button.active{background:#123b91}
input[type=text],select,textarea{width:100%;min-width:0;border:1px solid #d4dce8;border-radius:8px;padding:10px;background:white}
label{display:block;font-size:14px;font-weight:bold;margin-bottom:7px}
.small{font-size:13px;line-height:1.65;color:#647187}
.notice{background:#fff8df;border:1px solid #f0dfaa;padding:11px;border-radius:9px;font-size:14px;line-height:1.8}
.name-list{display:grid;grid-template-columns:1fr;gap:8px}
.name-row{display:grid;grid-template-columns:minmax(0,1fr) 76px;gap:7px}
.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}
.actions button{flex:1}
.table-wrap{overflow-x:auto;margin-top:12px}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:12px}
th,td{border:1px solid #dce3ee;text-align:center;padding:8px 5px;line-height:1.6}
th{background:#eaf0fc}
.a{background:#e2efff}
.b{background:#e0f7e8}
.street{background:#fff0dd}
.rest{background:#f0e8ff}
.person-card{padding:11px;margin:8px 0;border-radius:8px;line-height:1.7}
.hidden{display:none!important}
footer{text-align:center;color:#788397;font-size:12px;padding:20px}
@media(min-width:600px){.name-list{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<header>
<h1>전시대 순환봉사앱</h1>
<p>전체 교대표 · 개인 일정 · 공유 링크</p>
</header>

<main>
<section class="card">
<div class="tabs">
<button id="tabAll" class="active" onclick="showPage('all')">전체 교대표</button>
<button id="tabPerson" onclick="showPage('person')">개인 일정</button>
<button id="tabShare" onclick="showPage('share')">링크 공유</button>
</div>
</section>

<section class="card">
<h2>봉사자 이름 입력</h2>
<p class="small">이름을 입력하고 해당 조를 선택하세요. 이름은 빈칸으로 시작합니다.</p>
<div id="nameList" class="name-list"></div>
<div class="actions">
<button onclick="saveNames()">저장하기</button>
<button class="secondary" onclick="clearNames()">이름 모두 지우기</button>
</div>
<p id="saveMessage" class="small"></p>
</section>

<section id="pageAll">
<section class="card">
<h2>전체 순환 봉사표</h2>
<div class="notice">
<strong>A 전시대:</strong> 영인면사무소 앞<br>
<strong>B 전시대:</strong> 농협 하나로마트 앞<br>
<strong>교대 간격:</strong> 15분
</div>
<label for="sessionAll" style="margin-top:14px">봉사 일정</label>
<select id="sessionAll" onchange="renderAll()">
<option value="wed">수요일 18:00~20:00</option>
<option value="satam">토요일 10:00~12:00</option>
<option value="satpm">토요일 18:00~20:00</option>
</select>
<div id="allSchedule" class="table-wrap"></div>
</section>
</section>

<section id="pagePerson" class="hidden">
<section class="card">
<h2>개인별 봉사 일정</h2>
<label for="personSelect">봉사자 선택</label>
<select id="personSelect" onchange="renderPerson()"></select>
<label for="sessionPerson" style="margin-top:14px">봉사 일정</label>
<select id="sessionPerson" onchange="renderPerson()">
<option value="wed">수요일 18:00~20:00</option>
<option value="satam">토요일 10:00~12:00</option>
<option value="satpm">토요일 18:00~20:00</option>
</select>
<div id="personSchedule" style="margin-top:12px"></div>
<div class="actions">
<button class="green" onclick="sharePerson()">개인 일정 링크 만들기</button>
</div>
</section>
</section>

<section id="pageShare" class="hidden">
<section class="card">
<h2>공유 링크 만들기</h2>
<p class="small">입력한 이름과 조 편성이 링크에 포함됩니다. 다른 사람도 전체 명단과 교대표를 확인할 수 있습니다.</p>
<div class="actions">
<button onclick="makeShareLink()">링크 생성</button>
<button class="green" onclick="copyShareLink()">링크 복사</button>
</div>
<textarea id="shareLink" rows="4" readonly style="margin-top:10px" placeholder="공유 링크"></textarea>
<div class="actions">
<button class="orange" onclick="sendShare()">공유하기</button>
</div>
<p id="shareMessage" class="small"></p>
</section>
</section>
</main>

<footer>전시대 순환봉사앱 · 15분 순환 봉사</footer>

<script>
const TOTAL=12;
const SESSIONS={
  wed:{label:"수요일 18:00~20:00",start:1080},
  satam:{label:"토요일 10:00~12:00",start:600},
  satpm:{label:"토요일 18:00~20:00",start:1080}
};
const TASKS=[
  {name:"A 전시대",cls:"a"},
  {name:"가두봉사",cls:"street"},
  {name:"B 전시대",cls:"b"},
  {name:"휴식",cls:"rest"}
];
let people=[];

function defaultPeople(){
  return Array.from({length:TOTAL},()=>({name:"",group:0}));
}

function normalizePeople(list){
  return Array.from({length:TOTAL},(_,i)=>{
    const p=list&&list[i]?list[i]:{name:"",group:0};
    return {
      name:String(p.name||"").trim(),
      group:Math.max(0,Math.min(3,Number(p.group)||0))
    };
  });
}

function encodeData(){
  const bytes=new TextEncoder().encode(JSON.stringify({v:1,people}));
  let binary="";
  bytes.forEach(b=>binary+=String.fromCharCode(b));
  return btoa(binary).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}

function decodeData(value){
  try{
    let s=value.replace(/-/g,"+").replace(/_/g,"/");
    while(s.length%4)s+="=";
    const bytes=Uint8Array.from(atob(s),c=>c.charCodeAt(0));
    const obj=JSON.parse(new TextDecoder().decode(bytes));
    if(obj.v!==1||!Array.isArray(obj.people))return false;
    people=normalizePeople(obj.people);
    return true;
  }catch(e){return false}
}

function loadInitial(){
  const match=location.hash.match(/(?:^#|&)data=([^&]+)/);
  if(match&&decodeData(match[1]))return;
  try{
    const saved=localStorage.getItem("rotation_volunteer_v3");
    if(saved){people=normalizePeople(JSON.parse(saved));return}
  }catch(e){}
  people=defaultPeople();
}

function saveLocal(){
  try{localStorage.setItem("rotation_volunteer_v3",JSON.stringify(people))}catch(e){}
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

function renderNames(){
  const root=document.getElementById("nameList");
  root.innerHTML="";
  people.forEach((p,i)=>{
    const row=document.createElement("div");
    row.className="name-row";
    const input=document.createElement("input");
    input.type="text";
    input.maxLength=30;
    input.value=p.name;
    input.placeholder="이름 입력";
    input.setAttribute("aria-label","봉사자 이름 "+(i+1));
    const select=document.createElement("select");
    select.setAttribute("aria-label","조 선택");
    for(let g=0;g<4;g++){
      const opt=document.createElement("option");
      opt.value=String(g);
      opt.textContent=(g+1)+"조";
      select.appendChild(opt);
    }
    select.value=String(p.group);
    row.append(input,select);
    root.appendChild(row);
  });
}

function readNames(){
  people=Array.from(document.querySelectorAll("#nameList .name-row"),row=>({
    name:row.querySelector("input").value.trim(),
    group:Number(row.querySelector("select").value)
  }));
}

function saveNames(){
  readNames();
  saveLocal();
  renderNames();
  refreshViews();
  document.getElementById("saveMessage").textContent="저장했습니다.";
}

function clearNames(){
  if(!confirm("모든 이름을 지울까요?"))return;
  people=defaultPeople();
  saveLocal();
  renderNames();
  refreshViews();
  document.getElementById("saveMessage").textContent="이름을 모두 지웠습니다.";
}

function timeText(n){
  return String(Math.floor(n/60)).padStart(2,"0")+":"+
         String(n%60).padStart(2,"0");
}

function getSlots(key){
  return Array.from({length:8},(_,i)=>({
    start:SESSIONS[key].start+i*15,
    end:SESSIONS[key].start+(i+1)*15,
    rotation:i
  }));
}

function getTask(group,rotation){
  return TASKS[(group+rotation)%4];
}

function groupNames(group){
  return people.filter(p=>p.group===group&&p.name)
    .map(p=>escapeHtml(p.name)).join("<br>");
}

function renderAll(){
  const key=document.getElementById("sessionAll").value;
  let html="<table><thead><tr><th>시간</th>";
  for(let g=0;g<4;g++)html+="<th>"+(g+1)+"조</th>";
  html+="</tr></thead><tbody>";
  getSlots(key).forEach(slot=>{
    html+="<tr><th>"+timeText(slot.start)+"~"+timeText(slot.end)+"</th>";
    for(let g=0;g<4;g++){
      const task=getTask(g,slot.rotation);
      const names=groupNames(g);
      html+='<td class="'+task.cls+'"><strong>'+task.name+
        "</strong>"+(names?"<br>"+names:"")+"</td>";
    }
    html+="</tr>";
  });
  document.getElementById("allSchedule").innerHTML=html+"</tbody></table>";
}

function renderPersonOptions(){
  const sel=document.getElementById("personSelect");
  const old=sel.value;
  sel.innerHTML="";
  people.forEach((p,i)=>{
    if(!p.name)return;
    const opt=document.createElement("option");
    opt.value=String(i);
    opt.textContent=p.name;
    sel.appendChild(opt);
  });
  if(Array.from(sel.options).some(o=>o.value===old))sel.value=old;
}

function renderPerson(){
  const sel=document.getElementById("personSelect");
  const p=people[Number(sel.value)];
  const root=document.getElementById("personSchedule");
  if(!p||!p.name){
    root.innerHTML='<p class="small">이름을 입력하고 저장해 주세요.</p>';
    return;
  }
  const key=document.getElementById("sessionPerson").value;
  let html='<div class="notice"><strong>'+escapeHtml(p.name)+
    "</strong><br>"+(p.group+1)+"조 · "+SESSIONS[key].label+"</div>";
  getSlots(key).forEach(slot=>{
    const task=getTask(p.group,slot.rotation);
    html+='<div class="person-card '+task.cls+'"><strong>'+
      timeText(slot.start)+"~"+timeText(slot.end)+
      "</strong><br>"+task.name+"</div>";
  });
  root.innerHTML=html;
}

function refreshViews(){
  renderAll();
  renderPersonOptions();
  renderPerson();
}

function showPage(page){
  ["all","person","share"].forEach(p=>{
    const cap=p[0].toUpperCase()+p.slice(1);
    document.getElementById("page"+cap).classList.toggle("hidden",p!==page);
    document.getElementById("tab"+cap).classList.toggle("active",p===page);
  });
  if(page==="share")makeShareLink();
}

function makeShareLink(){
  readNames();
  saveLocal();
  const link=location.href.split("#")[0]+"#data="+encodeData();
  document.getElementById("shareLink").value=link;
  document.getElementById("shareMessage").textContent="공유 링크를 생성했습니다.";
  return link;
}

async function copyText(text){
  try{
    await navigator.clipboard.writeText(text);
    return true;
  }catch(e){
    const area=document.getElementById("shareLink");
    area.value=text;
    area.focus();
    area.select();
    try{return document.execCommand("copy")}catch(err){return false}
  }
}

async function copyShareLink(){
  const ok=await copyText(makeShareLink());
  document.getElementById("shareMessage").textContent=ok?
    "복사 완료! 카카오톡에 붙여 넣으세요.":"링크를 직접 선택해 복사해 주세요.";
}

async function sendShare(){
  const link=makeShareLink();
  if(navigator.share){
    try{
      await navigator.share({title:"전시대 순환봉사앱",text:"전체 봉사표와 명단입니다.",url:link});
      return;
    }catch(e){}
  }
  const ok=await copyText(link);
  document.getElementById("shareMessage").textContent=ok?
    "링크를 복사했습니다. 카카오톡 대화방에 붙여 넣으세요.":"링크를 선택해 복사해 주세요.";
}

async function sharePerson(){
  readNames();
  saveLocal();
  const i=Number(document.getElementById("personSelect").value);
  const p=people[i];
  if(!p||!p.name){alert("먼저 이름을 입력하고 저장해 주세요.");return;}
  const key=document.getElementById("sessionPerson").value;
  const link=location.href.split("#")[0]+"#data="+encodeData()+
    "&person="+i+"&session="+key;
  document.getElementById("shareLink").value=link;
  if(navigator.share){
    try{
      await navigator.share({title:p.name+"님의 봉사 일정",text:p.name+"님의 개인 봉사 일정입니다.",url:link});
      return;
    }catch(e){}
  }
  const ok=await copyText(link);
  alert(ok?"개인 일정 링크를 복사했습니다.":"링크를 선택해 복사해 주세요.");
}

function openSharedPerson(){
  const match=location.hash.match(/[&]person=(\d+)/);
  const session=location.hash.match(/[&]session=(wed|satam|satpm)/);
  if(!match)return;
  showPage("person");
  document.getElementById("personSelect").value=String(
    Math.min(Number(match[1]),people.length-1)
  );
  if(session)document.getElementById("sessionPerson").value=session[1];
  renderPerson();
}

loadInitial();
renderNames();
refreshViews();
openSharedPerson();
</script>
</body>
</html>
