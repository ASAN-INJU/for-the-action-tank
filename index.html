<div class="card">

<h2>

📋 봉사시간 기록

</h2>


<div id="recordList">

</div>


</div>


</div>


<script>

/* =====================================
   저장 데이터
===================================== */

let records =
    JSON.parse(
        localStorage.getItem(
            "volunteerRecords"
        )
    ) || [];


let visits =
    JSON.parse(
        localStorage.getItem(
            "volunteerVisits"
        )
    ) || [];


let editRecordId = null;

let editVisitId = null;


/* =====================================
   공통 요소
===================================== */

const today =
    new Date()
        .toISOString()
        .split("T")[0];


/* =====================================
   봉사시간 요소
===================================== */

const dateInput =
    document.getElementById(
        "date"
    );

const startInput =
    document.getElementById(
        "startTime"
    );

const endInput =
    document.getElementById(
        "endTime"
    );

const contentInput =
    document.getElementById(
        "content"
    );

const calculatedTime =
    document.getElementById(
        "calculatedTime"
    );

const saveRecordBtn =
    document.getElementById(
        "saveRecordBtn"
    );

const cancelRecordBtn =
    document.getElementById(
        "cancelRecordBtn"
    );


/* =====================================
   재방문 요소
===================================== */

const visitPlace =
    document.getElementById(
        "visitPlace"
    );

const visitDate =
    document.getElementById(
        "visitDate"
    );

const visitNote =
    document.getElementById(
        "visitNote"
    );

const saveVisitBtn =
    document.getElementById(
        "saveVisitBtn"
    );

const cancelVisitBtn =
    document.getElementById(
        "cancelVisitBtn"
    );


/* =====================================
   기본 날짜
===================================== */

dateInput.value =
    today;

visitDate.value =
    today;


/* =====================================
   봉사시간 계산
===================================== */

function calculateMinutes() {

    const start =
        startInput.value;

    const end =
        endInput.value;


    if (
        !start ||
        !end
    ) {

        calculatedTime.innerText =
            "봉사시간을 입력해주세요.";

        return 0;

    }


    const startDate =
        new Date(
            `2000-01-01T${start}`
        );


    const endDate =
        new Date(
            `2000-01-01T${end}`
        );


    let diff =
        (
            endDate -
            startDate
        )
        /
        60000;


    if (
        diff < 0
    ) {

        diff +=
            24 * 60;

    }


    const hours =
        Math.floor(
            diff / 60
        );


    const minutes =
        diff % 60;


    calculatedTime.innerText =

        `총 봉사시간 : ${hours}시간 ${minutes}분`;


    return diff;

}


startInput.addEventListener(
    "change",
    calculateMinutes
);

endInput.addEventListener(
    "change",
    calculateMinutes
);


/* =====================================
   봉사시간 저장
===================================== */

saveRecordBtn.addEventListener(
    "click",
    () => {

        const date =
            dateInput.value;

        const start =
            startInput.value;

        const end =
            endInput.value;

        const content =
            contentInput.value.trim();


        if (
            !date ||
            !start ||
            !end
        ) {

            alert(
                "날짜와 시간을 입력해주세요."
            );

            return;

        }


        const minutes =
            calculateMinutes();


        if (
            minutes <= 0
        ) {

            alert(
                "봉사시간을 확인해주세요."
            );

            return;

        }


        if (
            editRecordId
        ) {

            const record =
                records.find(
                    item =>
                        item.id ===
                        editRecordId
                );


            if (
                record
            ) {

                record.date =
                    date;

                record.start =
                    start;

                record.end =
                    end;

                record.minutes =
                    minutes;

                record.content =
                    content;

            }


            editRecordId =
                null;


        } else {

            records.push({

                id:
                    Date.now(),

                date,

                start,

                end,

                minutes,

                content

            });

        }


        saveAll();

        renderAll();

        clearRecordForm();

    }
);


/* =====================================
   재방문 저장
===================================== */

saveVisitBtn.addEventListener(
    "click",
    () => {

        const place =
            visitPlace.value.trim();

        const date =
            visitDate.value;

        const note =
            visitNote.value.trim();


        if (
            !place
        ) {

            alert(
                "주소 또는 장소를 입력해주세요."
            );

            return;

        }


        if (
            editVisitId
        ) {

            const visit =
                visits.find(
                    item =>
                        item.id ===
                        editVisitId
                );


            if (
                visit
            ) {

                visit.place =
                    place;

                visit.date =
                    date;

                visit.note =
                    note;

            }


            editVisitId =
                null;


        } else {

            visits.push({

                id:
                    Date.now(),

                place,

                date,

                note,

                done:
                    false

            });

        }


        saveAll();

        renderAll();

        clearVisitForm();

    }
);


/* =====================================
   저장
===================================== */

function saveAll() {

    localStorage.setItem(

        "volunteerRecords",

        JSON.stringify(
            records
        )

    );


    localStorage.setItem(

        "volunteerVisits",

        JSON.stringify(
            visits
        )

    );

}


/* =====================================
   시간 표시
===================================== */

function formatMinutes(
    minutes
) {

    const hours =
        Math.floor(
            minutes / 60
        );


    const mins =
        minutes % 60;


    if (
        mins === 0
    ) {

        return `${hours}시간`;

    }


    return `${hours}시간 ${mins}분`;

}


/* =====================================
   전체 화면 출력
===================================== */

function renderAll() {

    renderVisits();

    renderRecords();

    updateStats();

}


/* =====================================
   재방문 목록
===================================== */

function renderVisits() {

    const list =
        document.getElementById(
            "visitList"
        );


    list.innerHTML =
        "";


    if (
        visits.length === 0
    ) {

        list.innerHTML =

            `<div class="empty">
                재방문할 곳이 없습니다.
            </div>`;

        return;

    }


    const sorted =
        [...visits].sort(
            (a, b) => {

                if (
                    a.done !==
                    b.done
                ) {

                    return a.done
                        ? 1
                        : -1;

                }


                return (
                    new Date(
                        a.date
                    ) -

                    new Date(
                        b.date
                    )
                );

            }
        );


    sorted.forEach(
        visit => {

            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "visit-item";


            div.innerHTML =

                `

                <div class="visit-place">

                    📍 ${escapeHTML(
                        visit.place
                    )}

                </div>


                <div class="visit-date">

                    📅 방문 예정일 :
                    ${visit.date || "미정"}

                </div>


                <div class="visit-note">

                    ${escapeHTML(
                        visit.note ||
                        "메모 없음"
                    )}

                </div>


                <span class="visit-status
                    ${visit.done
                        ? "done"
                        : ""}">

                    ${visit.done
                        ? "방문 완료"
                        : "재방문 필요"}

                </span>


                <div class="item-buttons">

                    <button
                        class="done-btn"
                        onclick="
                            toggleVisit(
                                ${visit.id}
                            )
                        "
                    >

                        ${visit.done
                            ? "미방문으로 변경"
                            : "방문 완료"}

                    </button>


                    <button
                        class="edit-btn"
                        onclick="
                            editVisit(
                                ${visit.id}
                            )
                        "
                    >

                        수정

                    </button>


                    <button
                        class="delete-btn"
                        onclick="
                            deleteVisit(
                                ${visit.id}
                            )
                        "
                    >

                        삭제

                    </button>

                </div>

                `;


            list.appendChild(
                div
            );

        }
    );

}


/* =====================================
   재방문 완료 변경
===================================== */

function toggleVisit(
    id
) {

    const visit =
        visits.find(
            item =>
                item.id ===
                id
        );


    if (
        !visit
    ) {

        return;

    }


    visit.done =
        !visit.done;


    saveAll();

    renderAll();

}


/* =====================================
   재방문 수정
===================================== */

function editVisit(
    id
) {

    const visit =
        visits.find(
            item =>
                item.id ===
                id
        );


    if (
        !visit
    ) {

        return;

    }


    visitPlace.value =
        visit.place;

    visitDate.value =
        visit.date;

    visitNote.value =
        visit.note;


    editVisitId =
        id;


    document.getElementById(
        "visitFormTitle"
    )
    .innerText =

        "📍 재방문할 곳 수정";


    saveVisitBtn.innerText =
        "수정 저장";


    cancelVisitBtn.style.display =
        "block";


    window.scrollTo({

        top: 0,

        behavior:
            "smooth"

    });

}


/* =====================================
   재방문 수정 취소
===================================== */

cancelVisitBtn.addEventListener(
    "click",
    () => {

        editVisitId =
            null;

        clearVisitForm();

    }
);


/* =====================================
   재방문 삭제
===================================== */

function deleteVisit(
    id
) {

    if (
        !confirm(
            "이 재방문 장소를 삭제할까요?"
        )
    ) {

        return;

    }


    visits =
        visits.filter(
            visit =>
                visit.id !==
                id
        );


    saveAll();

    renderAll();

}


/* =====================================
   봉사기록 목록
===================================== */

function renderRecords() {

    const list =
        document.getElementById(
            "recordList"
        );


    list.innerHTML =
        "";


    if (
        records.length === 0
    ) {

        list.innerHTML =

            `<div class="empty">
                아직 봉사 기록이 없습니다.
            </div>`;

        return;

    }


    const sorted =
        [...records].sort(

            (a, b) =>

                new Date(
                    b.date
                ) -

                new Date(
                    a.date
                )

        );


    sorted.forEach(
        record => {

            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "record";


            div.innerHTML =

                `

                <div class="record-date">

                    📅 ${record.date}

                </div>


                <div class="record-time">

                    ⏱️ ${record.start}
                    ~
                    ${record.end}

                    ·

                    ${formatMinutes(
                        record.minutes
                    )}

                </div>


                <div class="record-content">

                    ${escapeHTML(
                        record.content ||
                        "봉사 내용 없음"
                    )}

                </div>


                <div class="item-buttons">

                    <button
                        class="edit-btn"
                        onclick="
                            editRecord(
                                ${record.id}
                            )
                        "
                    >

                        수정

                    </button>


                    <button
                        class="delete-btn"
                        onclick="
                            deleteRecord(
                                ${record.id}
                            )
                        "
                    >

                        삭제

                    </button>

                </div>

                `;


            list.appendChild(
                div
            );

        }
    );

}


/* =====================================
   봉사기록 수정
===================================== */

function editRecord(
    id
) {

    const record =
        records.find(
            item =>
                item.id ===
                id
        );


    if (
        !record
    ) {

        return;

    }


    dateInput.value =
        record.date;

    startInput.value =
        record.start;

    endInput.value =
        record.end;

    contentInput.value =
        record.content;


    editRecordId =
        id;


    document.getElementById(
        "recordFormTitle"
    )
    .innerText =

        "⏱️ 봉사시간 수정";


    saveRecordBtn.innerText =
        "수정 저장";


    cancelRecordBtn.style.display =
        "block";


    calculateMinutes();


    window.scrollTo({

        top: 0,

        behavior:
            "smooth"

    });

}


/* =====================================
   봉사기록 수정 취소
===================================== */

cancelRecordBtn.addEventListener(
    "click",
    () => {

        editRecordId =
            null;

        clearRecordForm();

    }
);


/* =====================================
   봉사기록 삭제
===================================== */

function deleteRecord(
    id
) {

    if (
        !confirm(
            "이 봉사 기록을 삭제할까요?"
        )
    ) {

        return;

    }


    records =
        records.filter(
            record =>
                record.id !==
                id
        );


    saveAll();

    renderAll();

}


/* =====================================
   재방문 입력 초기화
===================================== */

function clearVisitForm() {

    visitPlace.value =
        "";

    visitDate.value =
        today;

    visitNote.value =
        "";


    editVisitId =
        null;


    document.getElementById(
        "visitFormTitle"
    )
    .innerText =

        "📍 재방문할 곳 추가";


    saveVisitBtn.innerText =
        "재방문 목록에 저장";


    cancelVisitBtn.style.display =
        "none";

}

function clearRecordForm() {

    dateInput.value =
        today;

    startInput.value =

    contentInput.value =

        "recordFormTitle"
    )
    .innerText =

    cancelRecordBtn.style.display =

/* =====================================
   통계
===================================== */

function updateStats() {

    let monthMinutes =
        0;


    const now =
        new Date();


    const currentYear =
        now.getFullYear();


    const currentMonth =
        now.getMonth();


    records.forEach(
        record => {

            const date =
                new Date(
                    record.date
                );


            if (

                date.getFullYear() ===
                currentYear

                &&

                date.getMonth() ===
                currentMonth

            ) {

                monthMinutes +=
                    Number(
                        record.minutes
                    );

            }

        }
    );


    document.getElementById(
        "monthTotal"
    )
    .innerText =

        formatMinutes(
            monthMinutes
        );


    const pendingVisits =
        visits.filter(
            visit =>
                !visit.done
        )
        .length;


    document.getElementById(
        "visitTotal"
    )
    .innerText =

        `${pendingVisits}곳`;

}


/* =====================================
   HTML 안전 처리
===================================== */

function escapeHTML(
    text
) {

    return String(
        text
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


/* =====================================
   시작
===================================== */

renderAll();
